<main class="app-main-screen">
  <section class="app-main-screen__hero">
    <h1 class="app-main-screen__hero-title">Skróć swoje linki w sekundę</h1>
    <p class="app-main-screen__hero-caption">
      Wklej swój długi adres URL poniżej i stwórz krótki, łatwy do udostępnienia link.
    </p>
  </section>
  <section class="app-main-screen__form-section">
    <form class="app-main-screen__form" (ngSubmit)="send()">
      <input
        class="app-main-screen__form-input"
        type="text"
        placeholder="https://twoj-bardzo-dlugi-url.com/..."
      />
      <button class="app-main-screen__form-btn" type="submit">Skróć</button>
    </form>
  </section>
  <section class="app-main-screen__recent">
    <p class="app-main-screen__recent-title">Ostatnio skrócone linki</p>
    @if (isMobile()) {
      <div class="app-main-screen__recent-cards">
        <app-card />
        <app-card />
        <app-card />
        <app-card />
        <app-card />
      </div>
    } @else {
      <app-table />
    }
  </section>
</main>
