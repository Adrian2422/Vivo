name: ASP.NET Core CI

on:
  push:
    branches: [ "feat/**", "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet msbuild build.proj -t:RestoreSolution

      - name: Build solution
        run: dotnet msbuild build.proj -t:BuildSolution -p:Configuration=Release

      # 1. PUSH TO FEATURE BRANCH (feat/*) – Only fast unit tests
      - name: Run Unit Tests
        if: startsWith(github.ref, 'refs/heads/feat/')
        run: dotnet msbuild build.proj -t:UnitTest -p:Configuration=Release

      # 2. PR TO DEVELOP OR MAIN – Full test suite + Code coverage report
      - name: Run All Tests & Coverage (PRs)
        if: github.event_name == 'pull_request'
        run: dotnet msbuild build.proj -t:Coverage -p:Configuration=Release

      - name: Report Code Coverage
        if: github.event_name == 'pull_request'
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: 'coverage/**/coverage.cobertura.xml'
          badge: true
          format: markdown
          output: file

      - name: Add Coverage PR Comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: code-coverage-results.md
          
          # 3. PUSH/MERGE TO DEVELOP OR MAIN – Final verification of entire codebase
      - name: Final Full Check (Develop / Main)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        run: dotnet msbuild build.proj -t:TestSolution -p:Configuration=Release