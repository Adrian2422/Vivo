name: .NET CI

on:
  push:
    branches: [ "develop", "main" ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.props'
      - '**.targets'
      - 'Vivo.slnx'
      - 'build.proj'
      - 'global.json'
      - 'dotnet-tools.json'
      - 'tests/**'
      - '.github/workflows/ci-dotnet.yml'
  pull_request:
    branches: [ "develop", "main" ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.props'
      - '**.targets'
      - 'Vivo.slnx'
      - 'build.proj'
      - 'global.json'
      - 'dotnet-tools.json'
      - 'tests/**'
      - '.github/workflows/ci-dotnet.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  dotnet:
    name: .NET Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore & Build
        run: |
          dotnet restore Vivo.slnx
          dotnet build Vivo.slnx --no-restore -c Release

      # PR: Testy z generowaniem Coverage i raportu
      - name: Run Tests with Coverage (PRs)
        if: github.event_name == 'pull_request'
        run: |
          dotnet tool restore
          dotnet test Vivo.slnx --no-build -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage
          dotnet reportgenerator -reports:coverage/**/coverage.cobertura.xml -targetdir:coverage "-reporttypes:Cobertura;Html"

      # Push (develop/main): Szybkie uruchomienie wszystkich testów
      - name: Run All Tests (Push)
        if: github.event_name == 'push'
        run: dotnet test Vivo.slnx --no-build -c Release

      - name: Report .NET Coverage
        if: github.event_name == 'pull_request'
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: 'coverage/Cobertura.xml'
          badge: true
          format: markdown
          output: file
          indicators: true

      - name: Add .NET Coverage Comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: dotnet-coverage
          path: code-coverage-results.md
