name: Angular CI

on:
  push:
    branches: [ "develop", "main" ]
    paths:
      - 'src/Vivo.Web/**'
      - '.github/workflows/ci-web.yml'
  pull_request:
    branches: [ "develop", "main" ]
    paths:
      - 'src/Vivo.Web/**'
      - '.github/workflows/ci-web.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  web:
    name: Angular Lint, Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Vivo.Web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'src/Vivo.Web/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Angular
        run: npm run build

      # PR: Testy z Coverage
      - name: Run Tests with Coverage (PRs)
        if: github.event_name == 'pull_request'
        run: npm run test:cov-once

      # Push (develop/main): Standardowe testy bez narzutu Coverage
      - name: Run Unit Tests (Push)
        if: github.event_name == 'push'
        run: npm run test:once

      - name: Report Web Coverage
        if: github.event_name == 'pull_request'
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: 'src/Vivo.Web/coverage/**/cobertura-coverage.xml'
          badge: true
          format: markdown
          output: file
          indicators: true

      - name: Add Web Coverage Comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: web-coverage
          path: code-coverage-results.md
